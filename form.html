
<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ລາຍການວຽກຂອງຂ້ອຍ</title>

    <!-- ເຊື່ອມຕໍ່ CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ກ່ອງຫຼັກ -->
    <div class="container">

        <!-- ຫົວຂໍ້ -->
        <h1>ລາຍການວຽກຂອງຂ້ອຍ</h1>

        <!-- ສ່ວນເພີ່ມວຽກ -->
        <div class="input-container">

            <input
                type="text"
                id="taskInput"
                placeholder="ເພີ່ມວຽກໃໝ່..."
            >

            <button id="addBtn">
                ເພີ່ມ
            </button>

        </div>

        <!-- ສ່ວນສະແດງລາຍການວຽກ -->
        <ul id="taskList"></ul>

    </div>

    <!-- ເຊື່ອມຕໍ່ JavaScript -->
    <script src="javascrip.js"></script>

</body>
</html>
